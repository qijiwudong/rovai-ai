name: Build macOS 12 Intel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install Rust 1.97.1 with x86_64 target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos12-x64-arm64-host-v1
          cache-on-failure: true

      - name: Build x86_64 Rust sidecars
        run: node scripts/build-core.mjs --release --target-key macos-x64

      - name: Package Rust sidecars
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent resources/bin/macos-x64 dist/rovai-binaries.zip
          unzip -l dist/rovai-binaries.zip

      - name: Upload Rust sidecars
        uses: actions/upload-artifact@v4
        with:
          name: rovai-macos12-x64-binaries
          path: dist/rovai-binaries.zip
          if-no-files-found: error
          retention-days: 3

  package:
    needs: build-rust
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Rust sidecars
        uses: actions/download-artifact@v4
        with:
          name: rovai-macos12-x64-binaries
          path: dist/artifact

      - name: Restore Rust sidecars
        run: |
          set -euo pipefail
          unzip -q dist/artifact/rovai-binaries.zip -d .
          chmod +x resources/bin/macos-x64/rovai-core resources/bin/macos-x64/rovai-host resources/bin/macos-x64/rovai
          lipo -archs resources/bin/macos-x64/rovai-host
          lipo -archs resources/bin/macos-x64/rovai

      - name: Build desktop bundles
        run: pnpm build:desktop

      - name: Package ad-hoc App and ZIP for macOS 12+
        run: |
          set -euo pipefail
          pnpm exec electron-builder --mac dir --x64 --publish never -c.mac.identity=- -c.mac.minimumSystemVersion=12.0
          APP="dist/mac/Rovai AI.app"
          test -d "$APP"
          VERSION="$(node -p "require('./package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Rovai-AI-${VERSION}-x64-macos12.zip"

      - name: Verify architecture and minimum system version
        run: |
          set -euo pipefail
          APP="dist/mac/Rovai AI.app"
          test -d "$APP"
          echo "LSMinimumSystemVersion=$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"
          echo "App: $(lipo -archs "$APP/Contents/MacOS/Rovai AI")"
          echo "rovai-host: $(lipo -archs "$APP/Contents/Resources/bin/rovai-host")"
          echo "rovai: $(lipo -archs "$APP/Contents/Resources/bin/rovai")"
          plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist" | grep -qxE '12(\.0)?'
          lipo -archs "$APP/Contents/MacOS/Rovai AI" | grep -qx "x86_64"
          lipo -archs "$APP/Contents/Resources/bin/rovai-host" | grep -qx "x86_64"
          unzip -t "dist/Rovai-AI-"*"-x64-macos12.zip" >/dev/null

      - name: Upload macOS 12 Intel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rovai-macos12-x64
          path: dist/*-x64-macos12.zip
          if-no-files-found: error
          retention-days: 14
